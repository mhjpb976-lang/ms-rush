<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#7dd3fc;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:8px;display:flex;gap:6px;justify-content:center;pointer-events:none;z-index:10}
.chip{background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:5px 9px;text-align:center;min-width:56px;border:2px solid transparent}
.chip.me{border-color:#facc15}.chip.ko{opacity:.35}
.chip b{font-size:18px;display:block}
#rank{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:12px;color:#fff;font-weight:900;font-size:28px;text-shadow:0 2px 6px #000;z-index:10}
#toast{position:fixed;top:30%;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:30px;text-shadow:0 3px 8px #000;pointer-events:none;z-index:12;opacity:0;transition:opacity .2s}
#zl,#zr{position:fixed;top:0;bottom:0;width:50%;z-index:20;display:flex;align-items:flex-end;padding:20px;box-sizing:border-box;color:rgba(255,255,255,.6);font-weight:700;font-size:13px}
#zl{left:0}#zr{right:0;justify-content:flex-end}
#ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px}
#gbar{width:150px;height:12px;background:#374151;border-radius:9px;overflow:hidden}
#gf{height:100%;width:0;background:linear-gradient(90deg,#f97316,#facc15)}
#sk{width:92px;height:92px;border-radius:50%;border:0;background:#fff;color:#1e293b;font-weight:900;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);position:relative;overflow:hidden}
#sk.rdy{background:#facc15;animation:p .6s infinite alternate}

#cdm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);height:0}
.ov{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);align-items:center;justify-content:center;color:#fff;text-align:center}
.ov .in{background:#0f172a;border-radius:18px;padding:22px 24px;max-width:340px}
.ov h1{margin:0 0 4px;font-size:30px}.ov p{margin:4px 0 12px;font-size:13px;opacity:.85;line-height:1.5}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button,#rb{border:0;border-radius:12px;padding:12px 6px;font-weight:900;font-size:15px;color:#111}
.pick small{display:block;font-weight:600;font-size:10px;margin-top:3px}
#rb{background:#facc15;padding:12px 26px;margin-top:10px}
.ov .in{max-height:88vh;overflow:auto;width:320px}.gb{border:0;border-radius:12px;background:#a78bfa;color:#111;font-weight:900;padding:10px 18px;font-size:15px}.gm{min-height:20px;font-size:13px;margin:6px 0;font-weight:700}.ros{display:flex;flex-direction:column;gap:6px;text-align:left}.card{border:3px solid transparent;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;color:#111;text-align:left}.card.on{border-color:#fff;box-shadow:0 0 0 2px #facc15}.xb{height:5px;background:rgba(0,0,0,.25);border-radius:4px;margin-top:4px}.xb i{display:block;height:100%;background:#111;border-radius:4px}
#sl{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,255,255,.4) 100%)}
.ov .in{width:min(380px,94vw)}.tabs{display:flex;gap:4px;margin:6px 0}.tabs button{flex:1;border:0;border-radius:8px;padding:8px 2px;font-weight:800;background:#1e293b;color:#fff;font-size:13px}.tabs button.on{background:#facc15;color:#111}
.chips{display:inline-flex;gap:4px;margin:4px 6px 4px 0}.chips button{border:0;border-radius:8px;padding:5px 9px;background:#1e293b;color:#fff;font-weight:800}.chips button.on{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.sc{border:3px solid transparent;border-radius:10px;padding:6px 3px;font-size:11px;font-weight:800;color:#111;text-align:center}.sc small{display:block;font-weight:700;font-size:11px}.sc.on{border-color:#fff;box-shadow:0 0 0 2px #facc15}.sc.un{background:#334155;color:#64748b}
.bk{border:0;background:none;color:#93c5fd;font-weight:800;padding:6px 0}.nm{font-size:18px;font-weight:900;margin:8px 0 2px}.st2{font-size:12px;text-align:left;margin:4px 0;line-height:1.5}.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.row .gb{flex:1;font-size:12px;padding:8px 6px}
.go{position:sticky;bottom:-22px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0f172a;padding:10px 0 4px;margin-top:8px;font-weight:800;font-size:13px}
.wt{font-size:12px;font-weight:800;margin:8px 0 4px;text-align:left}.nodes{display:flex;gap:5px}.nd{flex:1;border:3px solid transparent;border-radius:10px;padding:6px 0;font-weight:900;font-size:13px;background:#facc15;color:#111}.nd small{display:block;font-size:10px}.nd.on{border-color:#fff;box-shadow:0 0 0 2px #38bdf8}.nd.lk{background:#334155;color:#64748b}
#mu{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:35;border:0;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;font-size:16px;padding:6px 9px}
#sk{box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 calc(var(--p,0)*12px) var(--c,#fff);transition:box-shadow .05s}
#sk.dn{animation:none!important;transform:scale(.86);filter:brightness(.9)}
#sk.now{box-shadow:0 0 0 6px #facc15,0 0 24px #facc15;animation:p .2s infinite alternate}
#sk[data-f=fire].tap{animation:tapfire .26s}#sk[data-f=water].tap{animation:tapwater .38s}#sk[data-f=grass].tap{animation:tapgrass .36s}#sk[data-f=elec].tap{animation:tapelec .16s}
@keyframes tapfire{0%{transform:scale(.8)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes tapwater{0%{transform:scale(1,.82)}40%{transform:scale(1.12,.92)}70%{transform:scale(.96,1.06)}100%{transform:scale(1)}}
@keyframes tapgrass{0%{transform:scale(1)}50%{transform:scale(.84,1.1)}100%{transform:scale(1)}}
@keyframes tapelec{0%{transform:none}20%{transform:translate(-4px,2px) scale(1.06)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,0)}100%{transform:none}}
#cb{display:flex;gap:4px;opacity:.45;transition:opacity .15s}#cb i{font-style:normal;font-size:11px;font-weight:900;padding:2px 9px;border-radius:9px;background:rgba(0,0,0,.5);color:#94a3b8}#cb i.on{background:#facc15;color:#7c2d12}
#sk.pop{animation:popk .35s}@keyframes popk{0%{transform:scale(.8)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
body.ttlon #ctl,body.ttlon #hud,body.ttlon #rank,body.ttlon #zl,body.ttlon #zr{visibility:hidden}
#ttl{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;padding-top:calc(13vh + env(safe-area-inset-top,0px));text-align:center;color:#fff;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0) 45%,rgba(0,0,0,.4))}
#ttl .logo{font-weight:900;font-size:min(20vw,110px);line-height:1;letter-spacing:.02em;background:linear-gradient(180deg,#fff7ad,#fcd34d 45%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7c2d12) drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:lg 1.6s ease-in-out infinite alternate}
@keyframes lg{to{transform:translateY(-6px) scale(1.03)}}
#ttl .tag{font-weight:800;font-size:15px;text-shadow:0 2px 6px #000;margin-top:10px}
#ttl .tstart{position:absolute;bottom:calc(8vh + env(safe-area-inset-bottom,0px));font-weight:900;font-size:20px;letter-spacing:.15em;text-shadow:0 2px 8px #000;animation:bl 1s infinite alternate}
@keyframes bl{from{opacity:.25}to{opacity:1}}
#mu{z-index:60}
.urb{background:linear-gradient(135deg,#fde68a33,#f9a8d433,#a5b4fc33);border:2px solid #fcd34d;border-radius:14px;padding:6px;margin:6px 0}.urt{font-weight:900;font-size:13px;color:#fde68a}
.urn{font-weight:900;font-size:16px;background:linear-gradient(90deg,#fde68a,#f9a8d4,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}.urs{font-size:11px;opacity:.85}
.ur{font-weight:900;font-size:18px;margin:8px 0;color:#fde68a;animation:rb 1s infinite alternate}@keyframes rb{from{filter:hue-rotate(0)}to{filter:hue-rotate(160deg)}}
</style>

<div class="ov" id="title" style="display:none"><div class="in">
<h1>MS RUSH</h1>
<p>左右で操作。ボタン短押し=通常技(3秒CT)／ゲージ満タンで長押し=スマッシュ。攻撃を受ける直前に方向を切り替えるとジャスト回避！<br>ゴール1位 or 全員コース外へ吹っ飛ばせば勝ち。</p>
<div id="menu"></div></div></div>
<div class="ov" id="res"><div class="in"><h1 id="rt"></h1><p id="rm"></p><button id="rb" style="background:#facc15;border:0;border-radius:12px;padding:12px 26px;font-weight:900;font-size:16px;margin-top:10px">育成画面へ</button></div></div>

<script>
const EL={
 fire:{n:'火',e:'🔥',c:0xf97316,css:'#fb923c',base:3.9,a:'火炎放射',b:'爆発ジャンプ'},
 water:{n:'水',e:'💧',c:0x38bdf8,css:'#38bdf8',base:4.0,a:'水流スライド',b:'水たまり'},
 grass:{n:'草',e:'🌿',c:0x22c55e,css:'#4ade80',base:3.85,a:'ツタのムチ',b:'シードトラップ'},
 elec:{n:'電気',e:'⚡',c:0xfacc15,css:'#fde047',base:4.1,a:'放電',b:'ジグザグ加速'}};
const KEYS=Object.keys(EL),FIN=-250,SPD=2,OOB=6.5,EDGE=5.3,$=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

// ---- 2D疑似3D描画 ----
const HUE={fire:.04,water:.56,grass:.35,elec:.14},cv=$('c'),g=cv.getContext('2d');let W,H,DPR;
function rs(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',rs);rs();
const SCL=40,P0=.84,K=8,KS=15,cx=(p,cu)=>W/2+cu*W*.5*(1-p)*(1-p),rw=p=>W*.03+(W*.62-W*.03)*p;

// ---- ステージテーマ ----
const GY=['#9aa5b8','#8793a8'];
const THEMES=[
 {n:'コンビニ前',e:'🏪',sky:['#60a5fa','#dbeafe'],gnd:GY,b:{h:[1.6,3.4],w:[1.2,2.2],k:'std'},sp:'conv',prop:'lamp'},
 {n:'信号の交差点',e:'🚦',sky:['#38bdf8','#e0f2fe'],gnd:GY,b:{h:[2,5],w:[1.2,2.2],k:'std'},prop:'signal',cw:1},
 {n:'電柱の住宅街',e:'🏘️',sky:['#fb923c','#fde68a'],gnd:['#a8a29e','#948f8a'],b:{h:[1.3,2.6],w:[1.2,2],k:'std'},prop:'pole'},
 {n:'標識ロード',e:'🪧',sky:['#7dd3fc','#f0f9ff'],gnd:GY,b:{h:[2,4.5],w:[1.2,2.2],k:'std'},prop:'sign'},
 {n:'横断歩道',e:'🚸',sky:['#a78bfa','#fef9c3'],gnd:GY,b:{h:[2.5,6],w:[1.2,2.2],k:'std'},prop:'lamp',cw:1},
 {n:'公園通り',e:'🌳',sky:['#86efac','#ecfccb'],gnd:['#6ee7a0','#4ade80'],b:null,prop:'park'},
 {n:'商店街',e:'🏮',sky:['#f472b6','#fed7aa'],gnd:['#b8a99a','#a69685'],b:{h:[1.3,2.4],w:[1.2,1.8],k:'shop'},prop:'lantern'},
 {n:'高架下',e:'🌉',sky:['#475569','#94a3b8'],gnd:['#78808f','#686f7e'],b:{h:[2,4],w:[1.2,2],k:'std'},prop:'via'},
 {n:'駅前',e:'🚉',sky:['#38bdf8','#fef3c7'],gnd:GY,b:{h:[2.5,6],w:[1.2,2.2],k:'std'},sp:'stn',prop:'lamp',cw:1},
 {n:'工場地帯',e:'🏭',sky:['#78716c','#d6d3d1'],gnd:['#6b7280','#5b6270'],b:{h:[1,2.2],w:[2,3.6],k:'fac'},prop:'lamp'}];
const ELC={fire:'#f97316',water:'#38bdf8',grass:'#4ade80',elec:'#fde047'};
let PEND=null,DOON=null,TT=0,CIN=null,E=[],PT=[],FL=null,HS=0,SHK=0,gC=0,gS0=100,gHy=0,gT=0;
function geo(p,p2){const pp=Math.min(p,1),pp2=Math.min(p2,1);return{c:cx(pp,gC),c2:cx(pp2,gC),w:rw(pp),w2:rw(pp2),s:gS0*p/P0,s2:gS0*p2/P0,y:gHy+(H-gHy)*p,y2:gHy+(H-gHy)*p2}}
function bld(G,sd,n,o,p){
 const s=G.s,s2=G.s2,y=G.y,y2=G.y2,xi=G.c+sd*G.w*1.2,xi2=G.c2+sd*G.w2*1.2,bh=(o.h[0]+hh(n+7)*(o.h[1]-o.h[0]))*s,bh2=bh/s*s2,bw=(o.w[0]+hh(n+3)*(o.w[1]-o.w[0]))*s,fx0=sd>0?xi:xi-bw;
 let col=[[210,18,62],[28,25,60],[0,0,72],[200,30,55],[340,20,66],[45,30,62]][Math.floor(hh(n+11)*6)];
 if(o.k==='conv')col=[0,0,94];if(o.k==='fac')col=[215,12,58];if(o.k==='stn')col=[40,25,82];
 g.fillStyle=`hsl(${col[0]},${col[1]}%,${col[2]-14}%)`;g.beginPath();g.moveTo(xi,y);g.lineTo(xi2,y2);g.lineTo(xi2,y2-bh2);g.lineTo(xi,y-bh);g.fill();
 g.fillStyle=`hsl(${col[0]},${col[1]}%,${col[2]}%)`;g.fillRect(fx0,y-bh,bw,bh);
 if(o.k==='fac'&&s>14){g.fillStyle=`hsl(${col[0]},${col[1]}%,${col[2]-10}%)`;for(let i=0;i<3;i++){g.beginPath();g.moveTo(fx0+i*bw/3,y-bh);g.lineTo(fx0+i*bw/3,y-bh-s*.3);g.lineTo(fx0+(i+1)*bw/3,y-bh);g.fill()}
  const cxx=fx0+bw*.72,cw=s*.24,ch=s*1.7;g.fillStyle='#78716c';g.fillRect(cxx,y-bh-ch,cw,ch);g.fillStyle='#ef4444';g.fillRect(cxx,y-bh-ch,cw,s*.12);
  for(let j=0;j<3;j++){g.fillStyle=`rgba(235,235,240,${.55-j*.14})`;g.beginPath();g.arc(cxx+cw/2+Math.sin(gT*1.5+j+n)*s*.12+j*s*.07,y-bh-ch-j*s*.3-s*.15,s*(.16+j*.08),0,7);g.fill()}
  g.fillStyle='#475569';for(let i=0;i<4;i++)g.fillRect(fx0+bw*.08+i*bw*.22,y-bh*.5,bw*.14,s*.08)}
 else if(s>16&&o.k!=='conv'){const cols=Math.max(2,Math.round(bw/(s*.3))),rows=Math.max(2,Math.floor((bh-s*.4)/(s*.32))),cw=bw/cols,ch=(bh-s*.4)/rows;
  for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){g.fillStyle=hh(n*13+r*7+q)<.4?'#fde68a':'#7dd3fc';g.fillRect(fx0+q*cw+cw*.2,y-bh+r*ch+ch*.2,cw*.6,ch*.55)}}
 if(o.k==='conv'){['#16a34a','#f97316','#ef4444'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(fx0,y-bh+i*s*.1,bw,s*.1)});g.fillStyle='#0ea5e9';g.fillRect(fx0+bw*.08,y-bh*.7,bw*.84,bh*.7-s*.02);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(fx0+bw*.1,y-bh*.66,bw*.2,bh*.5);if(s>26){g.fillStyle='#fff';g.font=`900 ${s*.22}px sans-serif`;g.textAlign='center';g.fillText('24h',fx0+bw/2,y-bh+s*.5)}}
 else if(o.k==='shop'){const nseg=Math.max(3,Math.round(bw/(s*.18))),sw=bw/nseg,hc=(hh(n+5)*360)|0;for(let i=0;i<nseg;i++){g.fillStyle=i%2?'#fff':`hsl(${hc},70%,50%)`;g.fillRect(fx0+i*sw,y-s*.78,sw,s*.24)}g.fillStyle='#1e293b';g.fillRect(fx0+bw*.12,y-s*.5,bw*.76,s*.5);g.fillStyle='#ef4444';g.beginPath();g.arc(fx0+bw*.5,y-s*.95,s*.07,0,7);g.fill()}
 else if(o.k==='stn'){g.fillStyle='#fff';g.strokeStyle='#334155';g.lineWidth=2;g.beginPath();g.arc(fx0+bw/2,y-bh*.7,s*.34,0,7);g.fill();g.stroke();g.beginPath();g.moveTo(fx0+bw/2,y-bh*.7);g.lineTo(fx0+bw/2,y-bh*.7-s*.24);g.moveTo(fx0+bw/2,y-bh*.7);g.lineTo(fx0+bw/2+s*.16,y-bh*.7);g.stroke();
  g.fillStyle='#0ea5e9';g.fillRect(fx0,y-bh*.32,bw,s*.3);if(s>24){g.fillStyle='#fff';g.font=`900 ${s*.24}px sans-serif`;g.textAlign='center';g.fillText('駅前',fx0+bw/2,y-bh*.32+s*.23)}g.fillStyle='#1e293b';g.fillRect(fx0+bw*.2,y-s*.55,bw*.6,s*.55)}
 else if(o.k==='std'){g.fillStyle=`hsl(${(hh(n+5)*360)|0},60%,45%)`;g.fillRect(fx0,y-s*.4,bw,s*.12);g.fillStyle='#1e293b';g.fillRect(fx0+bw*.15,y-s*.28,bw*.7,s*.28)}
 const fg=clamp((.7-p)*.9,0,.55);if(fg>.02){g.fillStyle=`rgba(214,226,242,${fg})`;g.fillRect(fx0,y-bh,bw,bh)}}
function prop(kind,G,sd,n,idx,WP){
 const s=G.s,y=G.y,x=G.c+sd*G.w*1.12;
 if(kind==='lamp'||kind==='via'&&false){if(idx%2)return;g.fillStyle='#475569';g.fillRect(x-s*.02,y-s,s*.04,s);g.fillStyle='#fef08a';g.beginPath();g.arc(x-sd*s*.06,y-s*1.02,s*.07,0,7);g.fill()}
 else if(kind==='signal'){if(idx%4)return;const x2=x-sd*G.w*.7,ty=y-s*1.55;g.fillStyle='#374151';g.fillRect(x-s*.025,ty,s*.05,s*1.55);g.fillRect(Math.min(x,x2),ty,Math.abs(x2-x),s*.05);

  h+=`<button class="bk" data-a="back">← 一覧へ</button><div id="pvbox"></div><div class="nm">${EL[d.el].e} ${d.name} <b>${RN[d.rar]}</b>${S.sel===dc.id?' 👑':''}</div>

  <div class="st2">攻撃・吹っ飛ばし ×${pw.toFixed(2)}　速度 ×${(1+(pw-1)*.5).toFixed(2)}</div>

 else if(tab==='chars'){
  const l=S.chars.filter(c=>fEl==='all'||SP[c.sp].el===fEl).sort(SORTS[sortK][1]);
  h+=chips+`<button class="gb" style="padding:5px 10px;font-size:12px" data-a="sort">${SORTS[sortK][0]} ⇅</button> <span style="font-size:12px">${l.length}体</span><div class="grid">`+
  l.map(c=>{const d=SP[c.sp];return `<button class="sc ${c.id===S.sel?'on':''}" data-a="open" data-i="${c.id}" style="background:${d.rar===3?'linear-gradient(135deg,#fde68a,#f9a8d4,#a5b4fc)':EL[d.el].css}">${c.id===S.sel?'👑':EL[d.el].e} ${RN[d.rar]}<small>${d.name}</small>Lv${c.lv}${c.dup?'★'+c.dup:''}${bar(c)}</button>`}).join('')+`</div>`}
 else if(tab==='dex'){
  const own2=new Map(S.chars.map(c=>[c.sp,c])),lst=SP.filter(d=>fEl==='all'||d.el===fEl),no=d=>String(d.id+1).padStart(3,'0');
  if(dexId>=0){const d=SP[dexId],o=own2.get(dexId);
   h+=`<button class="bk" data-a="dback">← 図鑑へ</button><div id="pvbox"></div><div class="nm">No.${no(d)} ${o?EL[d.el].e+' '+d.name:'？？？'} <b>${RN[d.rar]}</b></div>
   <div class="st2">属性: ${EL[d.el].n}${EL[d.el].e}　${o?`所持中 Lv${o.lv} ★${o.dup}`:'未入手（シルエット表示）'}</div>
   <div class="st2">基本の強さ ×${[1,1.15,1.3,2][d.rar].toFixed(2)}（Lv1）<br>通常技: ${EL[d.el].a}<br>スマッシュ: ${EL[d.el].b}</div>
   <div class="row"><button class="gb" data-a="dnav" data-d="-1">← 前</button><button class="gb" data-a="dnav" data-d="1">次 →</button>${o?`<button class="gb" style="background:#4ade80" data-a="togo" data-i="${o.id}">育成画面へ</button>`:''}</div>`}
  else h+=chips+`<div class="grid">`+lst.map(d=>{const o=own2.get(d.id);return o?`<button class="sc" data-a="dopen" data-i="${d.id}" style="background:${d.rar===3?'linear-gradient(135deg,#fde68a,#f9a8d4,#a5b4fc)':EL[d.el].css}">${EL[d.el].e} ${RN[d.rar]}<small>${d.name}</small>No.${no(d)}</button>`:`<button class="sc un" data-a="dopen" data-i="${d.id}">？<small>？？？</small>No.${no(d)}</button>`}).join('')+`</div>`}
 else{const hasS=S.chars.some(c=>c.sp===100);
  h+=`<div class="urb"><div class="urt">✨ 超ウルトラレア ピックアップ ✨</div><div id="pvbox" style="width:62%;margin:4px auto"></div><div class="urn">UR　MEGAMI SHINA ${hasS?'（獲得済み）':''}</div><div class="urs">排出率 0.01%　強さ ×2.00　ゲージ初期50・溜まり+40%</div></div>`+(urHit?`<div class="ur">✨ UR MEGAMI SHINA 降臨！！ ✨</div>`:'')+
  `<div style="margin:10px 0"><button class="gb" data-a="gacha" data-n="1">1回（${COST}🪙）</button> <button class="gb" data-a="gacha" data-n="10">10連（${COST*10}🪙）</button></div><div class="gm">${gmsg||'排出率: N 70% / R 25% / SR 約5% / UR 0.01%'}</div>`}
 const d0=SP[P.sp];
 h+=`<div class="go"><span>👑 ${EL[d0.el].e}${d0.name} Lv${P.lv}</span><button class="gb" style="background:#facc15" data-a="go">${STAGES[selSt].id} 出発！</button></div>`;
 $('menu').innerHTML=h;
 if(tab==='chars'&&dc){$('pvbox').appendChild(pvc);pvShow(SP[dc.sp])}
 else if(tab==='dex'&&dexId>=0){$('pvbox').appendChild(pvc);pvShow(SP[dexId],!S.chars.some(c=>c.sp===dexId))}
 else if(tab==='gacha'){$('pvbox').appendChild(pvc);pvShow(SP[100])}}
$('menu').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,c=S.chars.find(x=>x.id===i);pmsg='';
 if(a==='tab'){tab=b.dataset.t;detail=0;confirmRel=0;dexId=-1}
 if(a==='fel')fEl=b.dataset.k;
 if(a==='sort'){const k=Object.keys(SORTS);sortK=k[(k.indexOf(sortK)+1)%k.length]}
 if(a==='open'){detail=i;confirmRel=0}
 if(a==='back'){detail=0;confirmRel=0}
 if(a==='stg')selSt=i;
 if(a==='dopen')dexId=i;
 if(a==='dback')dexId=-1;
 if(a==='dnav'){const l=SP.filter(d=>fEl==='all'||d.el===fEl),ix=l.findIndex(d=>d.id===dexId);dexId=l[(ix+ +b.dataset.d+l.length)%l.length].id}
 if(a==='togo'){tab='chars';detail=i;dexId=-1}
 if(a==='setp'&&c){S.sel=i;save();pmsg='パートナーに設定！'}
 if(a==='up'&&c){if(c.lv>=MAXLV)pmsg='最大レベルです';else if(S.coins<UPC)pmsg='コインが足りません';else{S.coins-=UPC;addExp(c,30);save();pmsg='EXP+30！'}}
 if(a==='rel'&&c){if(i===S.sel||S.chars.length<2)pmsg='パートナーは手放せません';else if(confirmRel!==i){confirmRel=i}else{S.coins+=REL[SP[c.sp].rar];S.chars=S.chars.filter(x=>x.id!==i);detail=0;confirmRel=0;save()}}
 if(a==='gacha'){pull(+b.dataset.n)}
 if(a==='go'){gmsg='';start(S.chars.find(x=>x.id===S.sel)||S.chars[0]);return}
 renderMenu()}

$('rb').onclick=()=>{$('res').style.display='none';$('title').style.display='flex';state='title';tab='map';detail=0;renderMenu()};
function end(win,msg){if(state!=='play')return;state='end';const rw=reward(win);$('rt').textContent=win?'勝利！':'敗北…';$('rm').innerHTML=msg+'<br>'+rw;setTimeout(()=>$('res').style.display='flex',900)}

// ---- エフェクト ----
function ring(x,z,c,r,ttl){fx.push({k:'ring',x,z,c:'#'+c.toString(16).padStart(6,'0'),r,t:ttl,T:ttl})}
function flame(s){fx.push({k:'flame',x:s.x,z:s.z,t:.5,T:.5})}

// ---- 戦闘 ----
function hit(src,t,o){
 if(t.ko||t.inv>0)return false;
 if(t.isP&&performance.now()-lastSteer<200){justDodge(t);return false}
 if(!t.isP&&Math.random()<.1){t.inv=.5;t.boost=1;return false}
 {const pw=(src.pw||1)*(src.cmT>0?1.4:1);o=Object.assign({},o,{dmg:(o.dmg||0)*pw,kb:(o.kb||0)*pw})}t.pct+=o.dmg||0;if(src.isP&&src.cArm>0&&(o.dmg||0)>0)counterHit(src,t);
 const dir=o.dir||(Math.sign(t.x-src.x)||(t.x>0?1:-1));
 t.vx+=dir*(o.kb||0)*(1+t.pct/60);
 t.stun=Math.max(t.stun,o.stun||0);t.slow=Math.max(t.slow,o.slow||0);t.root=Math.max(t.root,o.root||0);
 if(src.gauge!==undefined)src.gauge=Math.min(100,src.gauge+(o.dmg||0)*1.5*rev(src));
 t.gauge=Math.min(100,t.gauge+(o.dmg||0)*.8*rev(t));
 if(o.kb>6)ring(t.x,t.z,0xffffff,1.4,.25);impact(src,t,o);
 return true}
const others=s=>rs_.filter(r=>r!==s&&!r.ko);
const near=(s,r)=>Math.hypot(r.x-s.x,(r.z-s.z)*.6);
function use(s,kind){if(CIN||HS>0||state!=='play')return;const _p0=rs_[0].pct;
 const k=s.el;
 if(kind==='a'){
  if(s.cd>0||s.stun>0)return;s.cd=3;normalFx(s);
  if(k==='elec'){ring(s.x,s.z,0xfde047,3,.35);others(s).forEach(r=>near(s,r)<3&&hit(s,r,{dmg:6,kb:2,stun:.9}))}
  if(k==='fire'){flame(s);others(s).forEach(r=>r.z<s.z&&s.z-r.z<7&&Math.abs(r.x-s.x)<1.7&&hit(s,r,{dmg:5,kb:1,slow:2.5}))}
  if(k==='water'){s.slide=.6;s.hc={}}
  if(k==='grass'){let b=null;others(s).forEach(r=>{const d=s.z-r.z;if(d>0&&d<9&&Math.abs(r.x-s.x)<2.5&&(!b||d<s.z-b.z))b=r});
   if(b){hit(s,b,{dmg:6,kb:2});b.z+=4;ring(b.x,b.z,0x22c55e,1.5,.3)}else ring(s.x,s.z-3,0x22c55e,1,.25)}
  if(s.isP)toast(EL[k].a+'！');if(!s.isP)grazeCheck(s,'a',_p0)
 }else{
  if(s.gauge<100||s.stun>0)return;s.gauge=0;if(s.isP){SE.chargeStop();CIN={r:s,t:0,done:false};return}smashExec(s)}}
function contact(s,dmg,kb){others(s).forEach(r=>{if((s.hc[r.id]||0)<=0&&Math.hypot(r.x-s.x,r.z-s.z)<1.9){s.hc[r.id]=.6;if(hit(s,r,{dmg,kb})&&s.zig>0)vfx('chain',s,r,.25)}})}

// ---- 入力 ----
function setSteer(d){const n=performance.now();if(d!==steer&&d!==0){lastSteer=n;if(state==='play'&&!CIN){SE.move();if(lastDir&&d===-lastDir&&n-lastDirT<260)turnFx()}}if(d===0&&steer!==0){lastDir=steer;lastDirT=n}steer=d}
const held={l:false,r:false};const upd=()=>setSteer(held.l&&!held.r?-1:held.r&&!held.l?1:0);
[['zl','l'],['zr','r']].forEach(([id,k])=>{const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);held[k]=true;upd()});['pointerup','pointercancel'].forEach(n=>e.addEventListener(n,()=>{held[k]=false;upd()}))});
let sk0=0;
const skDown=()=>{SE.init();sk0=performance.now();$('sk').classList.add('dn');const p=rs_&&rs_[0];if(p&&state==='play'&&p.gauge>=100&&!CIN)SE.chargeStart()};
const skUp=()=>{$('sk').classList.remove('dn');SE.chargeStop();CHG=0;$('sk').style.setProperty('--p',0);if(state!=='play'||!sk0){sk0=0;return}const h=performance.now()-sk0;sk0=0;const p=rs_[0];if(h>=350&&p.gauge>=100)use(p,'b');else startNormal(p)};
addEventListener('pointerdown',()=>SE.init());$('mu').onclick=()=>{MUTE=!MUTE;$('mu').textContent=MUTE?'🔇':'🔊'};$('sk').addEventListener('animationend',()=>$('sk').classList.remove('tap','pop'));
$('sk').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{$('sk').setPointerCapture(e.pointerId)}catch(x){}skDown()});
$('sk').addEventListener('pointerup',e=>{e.stopPropagation();skUp()});
addEventListener('keydown',e=>{if(e.repeat)return;
 if(e.key==='a'||e.key==='ArrowLeft'){held.l=true;upd()}if(e.key==='d'||e.key==='ArrowRight'){held.r=true;upd()}
 if(e.key===' '){e.preventDefault();skDown()}});
addEventListener('keyup',e=>{if(e.key==='a'||e.key==='ArrowLeft'){held.l=false;upd()}if(e.key==='d'||e.key==='ArrowRight'){held.r=false;upd()}if(e.key===' ')skUp()});

// ---- ループ ----
let last=performance.now();
function tick(now){
 let dt=Math.min(.05,(now-last)/1000);last=now;const rdt=dt,t=(CIN||HS>0)?TT:(TT=now/1000);fxUpdate(rdt);if(rs_&&rs_[0])rs_[0].lean=(rs_[0].lean||0)+((state==='play'&&!CIN?steer*.17:0)-(rs_[0].lean||0))*Math.min(1,rdt*16);if(SLOWT>0&&HS<=0){SLOWT-=rdt;dt*=.3}if(CIN||HS>0)dt=0;if(COMBO){COMBO.t-=dt;if(COMBO.t<=0)COMBO=null}pvTick();
 if(state!=='title'&&rs_){
  const alive=rs_.filter(r=>!r.ko),lead=Math.min(...alive.map(r=>r.z));
  rs_.forEach(r=>{
   ['cd','stun','slow','root','boost','zig','slide','jump','inv','cmT','cArm'].forEach(k=>r[k]=Math.max(0,r[k]-dt));if(r.wind>0){r.wind-=dt;if(r.wind<=0){r.wind=0;use(r,'a')}}
   for(const k in r.hc)r.hc[k]-=dt;
   if(r.ko){r.koT+=dt;r.x+=r.vx*dt;r.z-=2*dt;r.rot=(r.rot||0)+dt*9;return}
   if(state==='play'){
    r.gauge=Math.min(100,r.gauge+4*rev(r)*(r.ur?1.4:1)*dt);
    if(!r.isP){ // AI
     r.aiT-=dt;if(r.aiT<=0){r.aiT=.6+Math.random();const o=others(r).sort((a,b)=>near(r,a)-near(r,b))[0];r.aiX=o&&Math.random()<.5?o.x:(Math.random()-.5)*8}
     const dx=r.aiX-r.x;if(Math.abs(dx)>.3)r.x+=Math.sign(dx)*6*dt*(r.stun||r.root?0:1);
     const o=others(r).sort((a,b)=>near(r,a)-near(r,b))[0];
     if(o){const d=near(r,o);if(d<3.5&&Math.random()<.04*r.ai)use(r,'a');if(r.gauge>=100&&d<5&&Math.random()<.03*r.ai)use(r,'b')}
    }else if(!r.stun)r.x+=steer*7.5*dt;
    if(r.zig>0)r.x+=Math.sin(t*14)*5*dt;
    if(r.zig>0)contact(r,12,9);if(r.slide>0)contact(r,8,4);
    // 設置物
    objs.forEach(o=>{if(r===o.own||o.dead)return;
     if(o.k==='water'&&Math.hypot(r.x-o.x,r.z-o.z)<2.2&&(o.hc[r.id]||0)<=0){o.hc[r.id]=1.5;hit(o.own,r,{dmg:4,kb:5,dir:Math.random()<.5?-1:1})}
     if(o.k==='grass'&&Math.hypot(r.x-o.x,r.z-o.z)<1){o.dead=true;hit(o.own,r,{dmg:10,kb:8,root:1.2})}})
    // 速度
    let sp=EL[r.el].base*(1+Math.min(.5,r.pct/400))*r.sp*SPD;
    sp*=r.stun>0||r.root>0?0:r.slow>0?.55:1;if(r.zig>0)sp*=1.7;if(r.slide>0)sp*=1.8;if(r.boost>0)sp*=1.5;
    sp*=1+clamp((r.z-lead)*.03,0,.3);
    r.cs=sp;r.z-=sp*dt;
   }
   r.x+=r.vx*dt;r.vx*=Math.exp(-2.2*dt);
   if(Math.abs(r.vx)<1&&Math.abs(r.x)>EDGE)r.x+=(clamp(r.x,-EDGE,EDGE)-r.x)*Math.min(1,dt*6);
   if(Math.abs(r.x)>OOB){r.ko=true;r.koT=0;r.vx=r.vx||(r.x>0?4:-4);if(r.isP)toast('場外へ吹っ飛んだ！');else toast(EL[r.el].n+'が場外へ！')}
   r.ph+=dt*(r.stun>0||r.root>0?0:22*(r.zig>0||r.slide>0?1.5:1));
  });
  if(state==='play'){const al=rs_.filter(r=>!r.ko);for(let i=0;i<al.length;i++)for(let j=i+1;j<al.length;j++){const a=al[i],b=al[j],dx=b.x-a.x;if(Math.abs(dx)<3.2&&Math.abs(b.z-a.z)<3.5){const sg=dx!==0?Math.sign(dx):(i%2?1:-1),ps=(3.2-Math.abs(dx))/2*Math.min(1,dt*10);a.x-=sg*ps;b.x+=sg*ps;[a,b].forEach(q=>{if(Math.abs(q.vx)<2)q.x=clamp(q.x,-5.8,5.8)})}}}
  const P=rs_[0];
  if(state==='play'){
   const w=rs_.find(r=>!r.ko&&r.z<=FIN);
   if(w)end(w.isP,w.isP?'1位でゴール！':EL[w.el].n+'属性に先にゴールされた…');
   else if(P.ko)end(false,'場外へ吹っ飛ばされた…');
   else if(rs_.filter(r=>!r.ko).length===1)end(true,'全員を場外へ！完全勝利！');
  }
  const f=rs_.find(r=>!r.ko)||P,tr=P.ko?f:P;
  const sf=clamp(((tr.cs||8)/8-1)/1.2,0,1);drawWorld(tr,sf,t);
  fx=fx.filter(e=>(e.t-=dt)>0);objs=objs.filter(o=>{o.t-=dt;return o.t>0&&!o.dead});
  rs_.forEach(r=>{const c=$('ch'+r.id);if(c){c.firstElementChild.textContent=Math.floor(r.pct)+'%';c.classList.toggle('ko',r.ko);c.style.color=r.pct>100?'#fca5a5':'#fff'}});
  const rk=rs_.filter(r=>!r.ko).sort((a,b)=>a.z-b.z).findIndex(r=>r===P)+1;$('rank').textContent=rk?rk+'位':'';
  if(prevG<100&&P.gauge>=100&&state==='play')readyFx(P);prevG=P.gauge;{const cs=COMBO?COMBO.step:0,cb=$('cb');cb.style.opacity=COMBO?1:.45;if(cb.children)for(let i=0;i<3;i++)cb.children[i].classList.toggle('on',i<cs||(i===2&&P.gauge>=100))}
  const chp=(sk0&&P.gauge>=100&&!CIN&&state==='play')?clamp((performance.now()-sk0)/350,0,1):0;CHG=chp;$('sk').style.setProperty('--p',chp);$('gf').style.width=(chp>0?100*(1-chp):P.gauge)+'%';const ready=P.gauge>=100;
  $('sk').classList.toggle('rdy',ready);$('sk').classList.toggle('now',P.cmT>0);$('skt').textContent=ready?'長押し\nSMASH':EL[pk].a;
  $('cdm').style.height=(P.cd/3*100)+'%';
 }
 if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').style.opacity=0}
 if(!(state!=='title'&&rs_))drawWorld(null,.25,t);if(ttlOn)drawTitle(t);requestAnimationFrame(tick)}
renderMenu();
{const own=new Set(S.chars.map(c=>c.sp)).size;$('ttp').textContent=`${Object.keys(S.st).length}/20 ステージクリア ・ 図鑑 ${own}/101`}
$('ttl').addEventListener('click',e=>{e.stopPropagation();SE.init();ttlOn=false;$('ttl').style.display='none';document.body.classList.remove('ttlon');$('title').style.display='flex';SE.brand();renderMenu()});
requestAnimationFrame(tick);
